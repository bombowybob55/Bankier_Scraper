name: Update data and deploy to GitHub Pages

on:
  schedule:
    # Runs at both 18:00 and 19:00 UTC on weekdays; the "check time" step
    # below only lets the run continue if it's currently ~20:00 in Warsaw,
    # so this covers both CET (winter) and CEST (summer) without manual changes.
    - cron: "0 18 * * 1-5"
    - cron: "0 19 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check Warsaw local time
        id: check
        run: |
          hour=$(TZ='Europe/Warsaw' date +%H)
          echo "Warsaw hour is $hour"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$hour" = "20" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.run == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check.outputs.run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        if: steps.check.outputs.run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily update
        if: steps.check.outputs.run == 'true'
        run: python start_analysis.py --no-browser --skip-failed --no-check-net

      - name: Commit updated data
        if: steps.check.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add historical_data.db historical_data_zagr.db swetrowo.html
          git diff --staged --quiet || git commit -m "Automated update $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push

      - name: Prepare Pages artifact
        if: steps.check.outputs.run == 'true'
        run: |
          mkdir -p site
          cp swetrowo.html site/index.html

      - name: Upload Pages artifact
        if: steps.check.outputs.run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        if: steps.check.outputs.run == 'true'
        uses: actions/deploy-pages@v4
